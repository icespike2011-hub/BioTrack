.ns{
  --ink:#060A14; --surface:#0C1322; --card:#121B2D; --raise:#182338;
  --line:#22304A; --line-soft:#1A2438;
  --txt:#E9EFFA; --dim:#8496B4; --faint:#5A6B88;
  --brain:${P.brain}; --heart:${P.heart}; --motion:${P.motion}; --voice:${P.voice};
  --low:#2FD8C6; --mod:#FFAE3B; --high:#FF4D6D;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  background:var(--ink); color:var(--txt); font-family:var(--sans);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.ns[data-theme="light"]{
  --ink:#EEF2F8; --surface:#FFFFFF; --card:#FFFFFF; --raise:#F3F6FB;
  --line:#D9E1EE; --line-soft:#E6ECF5;
  --txt:#0B1220; --dim:#5B6B85; --faint:#8695AC;
}
.ns *{box-sizing:border-box;}
.ns button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;}
.ns button:focus-visible,.ns [tabindex]:focus-visible{outline:2px solid var(--voice);outline-offset:2px;}

/* --- shell --- */
.shell{display:flex;min-height:100vh;}
.side{width:236px;flex:0 0 236px;border-right:1px solid var(--line-soft);
  background:var(--surface);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;}
.brand{padding:4px 10px 18px;}
.brand-mark{display:flex;align-items:center;gap:9px;}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--voice);box-shadow:0 0 12px var(--voice);}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.24em;}
.brand-sub{margin-top:6px;font-size:10.5px;color:var(--faint);letter-spacing:.08em;line-height:1.5;}
.nav-i{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  font-size:13.5px;color:var(--dim);width:100%;text-align:left;transition:background .15s,color .15s;}
.nav-i:hover{background:var(--raise);color:var(--txt);}
.nav-i[data-on="1"]{background:var(--raise);color:var(--txt);font-weight:600;}
.nav-i[data-on="1"] .nav-bar{opacity:1;}
.nav-bar{width:3px;height:16px;border-radius:2px;opacity:0;margin-left:auto;}
.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1500px;}
.topbar{display:none;}
.tabs{display:none;}

/* --- typography --- */
.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:600;}
.h1{font-size:23px;font-weight:700;letter-spacing:-.01em;margin:2px 0 0;}
.h2{font-size:15px;font-weight:650;letter-spacing:-.005em;}
.sub{font-size:12.5px;color:var(--dim);line-height:1.55;}
.read{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.big{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em;}
.unit{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:5px;}

/* --- surfaces --- */
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:16px;padding:16px;}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.row{display:flex;align-items:center;gap:10px;}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stack{display:flex;flex-direction:column;gap:14px;}

/* --- signal spine (signature element) --- */
.spine{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;margin-bottom:18px;}
.spine-cell{background:var(--card);padding:10px 12px 4px;min-width:0;}
.spine-top{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.spine-lab{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:600;}
.spine-val{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;}

/* --- bits --- */
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}
.live .dot{animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);font-size:11.5px;color:var(--dim);}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 20px;border-radius:12px;
  font-size:14px;font-weight:650;background:var(--raise);border:1px solid var(--line);transition:transform .12s,filter .15s;}
.btn:hover{filter:brightness(1.12);}
.btn:active{transform:scale(.985);}
.btn-primary{background:var(--voice);color:#04121A;border-color:transparent;}
.btn-ghost{background:transparent;}
.btn-lg{width:100%;padding:17px;font-size:15px;letter-spacing:.02em;}
.btn-sm{padding:8px 13px;font-size:12.5px;border-radius:9px;}
.meter{height:6px;border-radius:4px;background:var(--line-soft);overflow:hidden;}
.meter i{display:block;height:100%;border-radius:4px;transition:width .35s ease;}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv b{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;}
.hint{font-size:11.5px;color:var(--faint);line-height:1.6;}
.disclaim{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:11.5px;color:var(--dim);line-height:1.6;}
.scan{position:relative;overflow:hidden;}
.scan::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(47,216,198,.14),transparent);
  transform:translateX(-100%);animation:sweep 1.7s infinite;}
@keyframes sweep{to{transform:translateX(100%)}}
.seg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;}
.seg button{padding:6px 11px;border-radius:7px;font-size:12px;color:var(--dim);}
.seg button[data-on="1"]{background:var(--card);color:var(--txt);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.modal-bg{position:fixed;inset:0;background:rgba(3,6,12,.72);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:18px;}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:460px;width:100%;max-height:80vh;overflow:auto;}
.cellgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto;}
.cell{aspect-ratio:1;border-radius:14px;background:var(--raise);border:1px solid var(--line);transition:background .12s,transform .12s;}
.cell[data-lit="1"]{background:var(--voice);border-color:var(--voice);}
.cell:active{transform:scale(.96);}
.tapzone{border-radius:18px;border:1px solid var(--line);background:var(--raise);height:190px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;width:100%;}
.tapzone[data-go="1"]{background:var(--voice);color:#04121A;border-color:transparent;}
.list-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;
  background:var(--card);border:1px solid var(--line-soft);transition:border-color .15s;}
.list-row:hover{border-color:var(--line);}
.fade{animation:fade .3s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* --- mobile --- */
@media (max-width:900px){
  .side{display:none;}
  .main{padding:14px 14px 96px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 4px 14px;position:sticky;top:0;background:var(--ink);z-index:20;}
  .tabs{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--surface);border-top:1px solid var(--line-soft);padding:7px 4px calc(7px + env(safe-area-inset-bottom));}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 1px;border-radius:11px;
    font-size:9px;color:var(--faint);letter-spacing:.01em;}
  .tab[data-on="1"]{color:var(--txt);background:var(--raise);}
  .g4,.g3,.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .spine{grid-template-columns:repeat(2,1fr);}
  .big{font-size:34px;}
  .h1{font-size:19px;}
}
@media (max-width:380px){ .g4,.g3,.g2{grid-template-columns:1fr;} }
@media (prefers-reduced-motion:reduce){
  .ns *{animation:none !important;transition:none !important;}
}
